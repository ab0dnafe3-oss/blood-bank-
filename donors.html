<meta name='viewport' content='width=device-width, initial-scale=1'/><!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>قائمة المتبرعين - بنك الدم الخيري</title>
    <!-- استدعاء مكتبة Firebase -->
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>
    
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f6f9;
            margin: 0;
            padding: 15px;
            color: #333;
            /* حجم خط ديناميكي يتكيف بسلاسة مع حجم شاشة الجوال أو الكمبيوتر */
            font-size: clamp(13px, 1.1vw, 16px);
        }
        .container {
            max-width: 1000px;
            margin: 0 auto;
            background: #fff;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        h2 {
            text-align: center;
            color: #d9534f;
        }
        .filter-box {
            margin-bottom: 20px;
            display: flex;
            gap: 10px;
            align-items: center;
            flex-wrap: wrap;
        }
        .filter-box select {
            flex: 1;
            min-width: 200px;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: inherit;
        }
        .table-responsive {
            width: 100%;
            overflow-x: auto; /* يجعل الجدول قابلاً للتمرير أفقياً في الشاشات الصغيرة جداً */
        }
        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 600px;
        }
        th, td {
            border: 1px solid #ddd;
            padding: 12px 10px;
            text-align: center;
        }
        th {
            background-color: #d9534f;
            color: white;
        }
        tr:nth-child(even) {
            background-color: #f9f9f9;
        }
        .loading, .no-data {
            text-align: center;
            color: #666;
            padding: 20px;
            font-style: italic;
        }
        .back-btn {
            display: inline-block;
            margin-bottom: 15px;
            color: #0275d8;
            text-decoration: none;
            font-weight: bold;
        }
        .back-btn:hover {
            text-decoration: underline;
        }
        .phone-link {
            background: #5cb85c;
            color: white;
            padding: 6px 12px;
            border-radius: 4px;
            text-decoration: none;
            display: inline-block;
            font-weight: bold;
        }
        .phone-link:hover {
            background: #4cae4c;
        }
    </style>
</head>
<body>

<div class="container">
    <a href="index.html" class="back-btn">← العودة لصفحة التسجيل</a>
    <h2>📋 سجل جميع المتبرعين بالمدينة</h2>

    <!-- شريط البحث والفلترة -->
    <div class="filter-box">
        <label for="searchBloodGroup"><strong>تصفية حسب الفصيلة:</strong></label>
        <select id="searchBloodGroup" onchange="loadDonors()">
            <option value="">عرض كل المتبرعين (أكثر من 1000 متبرع)</option>
            <option value="A+">A+</option>
            <option value="A-">A-</option>
            <option value="B+">B+</option>
            <option value="B-">B-</option>
            <option value="AB+">AB+</option>
            <option value="AB-">AB-</option>
            <option value="O+">O+</option>
            <option value="O-">O-</option>
        </select>
    </div>

    <!-- جدول عرض المتبرعين -->
    <div class="table-responsive">
        <table>
            <thead>
                <tr>
                    <th>الاسم الكامل</th>
                    <th>العمر</th>
                    <th>رقم الهاتف</th>
                    <th>فصيلة الدم</th>
                    <th>العنوان</th>
                    <th>آخر تبرع</th>
                </tr>
            </thead>
            <tbody id="donorsTableBody">
                <tr><td colspan="6" class="loading">جاري تحميل قاعدة البيانات...</td></tr>
            </tbody>
        </table>
    </div>
</div>

<script>
    const firebaseConfig = {
        apiKey: "YOUR_API_KEY",
        authDomain: "YOUR_PROJECT_ID.firebaseapp.com",
        projectId: "YOUR_PROJECT_ID",
        storageBucket: "YOUR_PROJECT_ID.appspot.com",
        messagingSenderId: "YOUR_MESSAGING_SENDER_ID",
        appId: "YOUR_APP_ID"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    const donorsTableBody = document.getElementById('donorsTableBody');
    const searchBloodGroup = document.getElementById('searchBloodGroup');

    function loadDonors() {
        donorsTableBody.innerHTML = '<tr><td colspan="6" class="loading">جاري جلب البيانات...</td></tr>';
        const selectedGroup = searchBloodGroup.value;
        
        let query = db.collection("donors");
        if (selectedGroup !== "") {
            query = query.where("bloodGroup", "==", selectedGroup);
        }

        query.get().then((querySnapshot) => {
            donorsTableBody.innerHTML = '';
            
            if (querySnapshot.empty) {
                donorsTableBody.innerHTML = '<tr><td colspan="6" class="no-data">لا يوجد متبرعون مسجلون تطابق هذه الفصيلة حالياً.</td></tr>';
                return;
            }

            querySnapshot.forEach((doc) => {
                const donor = doc.data();
                const row = `<tr>
                    <td>${donor.name}</td>
                    <td>${donor.age}</td>
                    <td><a href="tel:${donor.phone}" class="phone-link">📞 ${donor.phone}</a></td>
                    <td><strong style="color: #d9534f; font-size: 1.1em;">${donor.bloodGroup}</strong></td>
                    <td>${donor.address}</td>
                    <td>${donor.lastDonation}</td>
                </tr>`;
                donorsTableBody.innerHTML += row;
            });
        }).catch((error) => {
            console.error("خطأ في الجلب: ", error);
            donorsTableBody.innerHTML = '<tr><td colspan="6" class="no-data" style="color:red;">فشل تحميل البيانات. تحقق من إعدادات قاعدة البيانات.</td></tr>';
        });
    }

    // تحميل كافة البيانات فور فتح الصفحة
    loadDonors();
</script>

</body>
</html>
